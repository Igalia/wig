id: com.igalia.wig
branch: master
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
base: com.igalia.wig.WPE
base-version: master
command: wig

finish-args:
  - --device=dri
  - --filesystem=xdg-config/openxr:ro
  - --filesystem=xdg-download
  - --filesystem=xdg-run/monado_comp_ipc
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland

cleanup:
  - /include
  - /lib/pkgconfig

inherit-extensions:
  - com.igalia.SparkleCDM.Module

modules:
  - name: wpe-platform-gtk
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - --buildtype=debugoptimized
    sources:
      - type: git
        url: https://github.com/Igalia/wpe-platform-gtk.git
        commit: 427606b962d5051afcd3780457b1ca554ebbb4f2

  - name: wig
    buildsystem: meson
    config-opts:
      - --buildtype=debugoptimized
    sources:
      - type: dir
        path: ..
        skip:
          - subprojects/wpe-platform-gtk
          - .flatpak-builder
          - .git
          - .ruff_cache
          - .cache
          - _build

