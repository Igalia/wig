<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Website Data</title>
  <link rel='stylesheet' href='wig:resources/style.css'>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-block: 1rem;
    }
    th {
      text-align: left;
      padding: 0.4rem 0.75rem;
      border-bottom: 2px solid color-mix(in srgb, currentColor 20%, transparent);
      font-weight: 600;
      font-size: 0.875em;
    }
    td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid color-mix(in srgb, currentColor 10%, transparent);
      vertical-align: middle;
    }
    tr.active td {
      background: color-mix(in srgb, currentColor 6%, transparent);
    }
    .actions-cell {
      white-space: nowrap;
      text-align: right;
    }
    .btn {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 4px;
      font: inherit;
      font-size: 0.8em;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      margin-inline-start: 0.35rem;
    }
    .btn:hover {
      background: color-mix(in srgb, currentColor 10%, transparent);
    }
    .btn-danger {
      border-color: color-mix(in srgb, red 40%, transparent);
      color: color-mix(in srgb, red 70%, currentColor);
    }
    .btn-danger:hover {
      background: color-mix(in srgb, red 10%, transparent);
    }
    .results-section {
      margin-block: 1.5rem;
    }
    .results-section h2 {
      margin-block-end: 0;
    }
    .empty {
      color: color-mix(in srgb, currentColor 50%, transparent);
      font-style: italic;
      padding: 0.75rem;
    }
    .size-cell {
      color: color-mix(in srgb, currentColor 60%, transparent);
      font-variant-numeric: tabular-nums;
      font-size: 0.875em;
      width: 8rem;
    }
  </style>
</head>

<body>
  <h1>Website Data</h1>

  {{if (has_results)}}
  <section class='results-section'>
    <h2>{{fetched_type_name}}</h2>
    {{if (has_entries)}}
    <table>
      <thead>
        <tr>
          <th>Origin</th>
          <th>Size</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {{for entry in entries}}
        <tr>
          <td>{{entry.origin}}</td>
          <td class='size-cell'>{{entry.size}}</td>
          <td class='actions-cell'>
            <a class='btn btn-danger' href='wig:website-data?action=remove&amp;origin={{entry.origin_escaped}}&amp;types={{fetch_key}}'>Remove</a>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <p class='empty'>No data found.</p>
    {{end}}
    <a class='btn btn-danger' href='wig:website-data?action=clear&amp;types={{fetch_key}}'>Clear all</a>
  </section>
  {{end}}

  <table>
    <thead>
      <tr>
        <th>Type</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{for type_item in types}}
      <tr {{if (type_item.active)}}class='active'{{end}}>
        <td>{{type_item.name}}</td>
        <td class='actions-cell'>
          <a class='btn' href='wig:website-data?fetch={{type_item.key}}'>Fetch</a>
          <a class='btn btn-danger' href='wig:website-data?action=clear&amp;types={{type_item.key}}'>Clear</a>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>

  <script>
    if (location.search)
      history.replaceState({}, '', location.href.split('?')[0]);
  </script>
</body>

</html>
