<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>User Styles</title>
  <link rel='stylesheet' href='wig:resources/style.css'>
</head>

<body>
  <h1>User Styles</h1>
  <p class='desc'>CSS injected into every page you visit.</p>

  {{if (has_styles)}}
  <div class='script-list'>
    {{for item in items}}
    <div class='script-card'>
      <div class='script-card-header'>
        <span class='script-meta'>{{item.level_label}} &middot; {{item.frames_label}} &middot; {{item.line_count}}</span>
        <a class='btn btn-danger' href='wig:user-styles?remove={{item.index_str}}'>Remove</a>
      </div>
      <pre><code>{{item.source}}</code></pre>
    </div>
    {{end}}
  </div>
  {{else}}
  <p class='empty'>No user styles installed.</p>
  {{end}}

  <h2 class='section-heading'>Add Style</h2>
  <form class='add-form' method='post' action='wig:user-styles'>
    <label for='source'>Source</label>
    <textarea id='source' name='source' rows='8' placeholder='/* CSS to inject into every page */'></textarea>
    <label for='level'>Level</label>
    <select id='level' name='level'>
      <option value='user'>User (overrides page styles)</option>
      <option value='author'>Author (page styles may override)</option>
    </select>
    <label for='frames'>Frames</label>
    <select id='frames' name='frames'>
      <option value='all'>All Frames</option>
      <option value='top'>Top Frame Only</option>
    </select>
    <div class='add-form-footer'>
      <button type='submit'>Add Style</button>
    </div>
  </form>

  <script>
    if (location.search)
      history.replaceState({}, '', location.href.split('?')[0]);
  </script>
</body>

</html>
