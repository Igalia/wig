<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='Content-Security-Policy' content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src 'nonce-{{nonce}}'; base-uri 'none'; form-action 'none'">
  <title>{{title}}</title>
  <link rel='stylesheet' href='wig:resources/style.css' nonce='{{nonce}}'>
</head>

<body>
  <h1>{{title}}</h1>
  <p class='desc'>These features are experimental and may change or be removed.</p>

  {{for category in categories}}
  <section class='category'>
    <h2>{{category.name}}</h2>
    <ul>
    {{for feature in category.features}}
      <li>
        <label for="{{feature.identifier}}">
          <span class='name'>{{feature.name}}</span>
          <span class='status' data-status='{{feature.status}}'>{{feature.status}}</span>
        </label>
        <input type='checkbox' id='{{feature.identifier}}' {{if (feature.enabled)}}checked{{end}}>
        <p class='details'>{{feature.details}}</p>
      </li>
    {{end}}
    </ul>
  </section>
  {{end}}

  <script nonce='{{nonce}}'>
    document.addEventListener('change', function(e) {
      if (e.target.type === 'checkbox')
        location.href = location.href.split('?')[0] + '?toggle=' + e.target.id + '&enabled=' + e.target.checked;
    });
    if (location.search)
      history.replaceState({}, '', location.href.split('?')[0]);
  </script>
</body>

</html>
