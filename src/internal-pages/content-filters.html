<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Content Filters</title>
  <link rel='stylesheet' href='wig:resources/style.css'>
</head>

<body>
  <h1>Content Filters</h1>
  <p class='desc'>Content blocking rules in <a href='https://webkit.org/blog/3476/content-blockers-first-look/'>WebKit content blocker</a> JSON format.</p>

  {{if (has_filters)}}
  <div class='script-list'>
    {{for item in items}}
    <div class='script-card'>
      <div class='script-card-header'>
        <span class='script-meta'>{{item.identifier}}</span>
        <a class='btn btn-danger' href='wig:content-filters?remove={{item.identifier}}'>Remove</a>
      </div>
    </div>
    {{end}}
  </div>
  {{else}}
  <p class='empty'>No content filters installed.</p>
  {{end}}

  {{if (error_message)}}
  <p class='filter-error'>Compilation error: {{error_message}}</p>
  {{end}}

  <h2 class='section-heading'>Add Filter</h2>
  <form class='add-form' method='post' action='wig:content-filters'>
    <label for='identifier'>Name</label>
    <input type='text' id='identifier' name='identifier' placeholder='my-filter'>
    <label for='source'>Rules (JSON)</label>
    <textarea id='source' name='source' rows='10' placeholder='[{"trigger":{"url-filter":".*"},"action":{"type":"block"}}]'></textarea>
    <div class='add-form-footer'>
      <button type='button' class='btn' id='open'>Open File…</button>
      <button type='submit'>Add Filter</button>
    </div>
  </form>

  <p class='filter-error' id='read-error' hidden></p>
  <p class='filter-status' id='status' hidden></p>

  <input type='file' id='file' accept='.json,application/json' hidden>
  <form method='post' action='wig:content-filters' id='file-form' hidden>
    <input type='hidden' name='identifier' id='file-identifier'>
    <input type='hidden' name='source' id='file-source'>
  </form>

  <script>
    if (location.search)
      history.replaceState({}, '', location.href.split('?')[0]);

    const file = document.getElementById('file');
    const fileForm = document.getElementById('file-form');
    const readError = document.getElementById('read-error');
    const status = document.getElementById('status');

    const installed = Array.from(document.querySelectorAll('.script-meta'), el => el.textContent.trim());

    /* Saving under an existing identifier replaces it, so make that explicit. */
    function confirmReplace(name) {
      return !installed.includes(name)
          || confirm('A filter named "' + name + '" is already installed. Replace it?');
    }

    function showCompiling(name) {
      readError.hidden = true;
      status.textContent = 'Compiling "' + name + '"…';
      status.hidden = false;
    }

    document.getElementById('open').addEventListener('click', () => {
      console.log('content-filters: opening file picker');
      file.click();
    });

    file.addEventListener('change', async () => {
      console.log('content-filters: change fired, ' + file.files.length + ' file(s)');
      const chosen = file.files[0];
      if (!chosen)
        return;
      console.log('content-filters: chosen ' + chosen.name + ' (' + chosen.size + ' bytes, type ' + chosen.type + ')');

      let text;
      try {
        text = await chosen.text();
      } catch (e) {
        console.error('content-filters: read failed: ' + e);
        readError.textContent = 'Could not read ' + chosen.name + ': ' + e.message;
        readError.hidden = false;
        return;
      }
      const name = chosen.name.replace(/\.json$/i, '');
      if (!confirmReplace(name))
        return;

      console.log('content-filters: read ' + text.length + ' chars, compiling "' + name + '"');
      document.getElementById('file-identifier').value = name;
      document.getElementById('file-source').value = text;
      showCompiling(name);
      fileForm.requestSubmit();
    });

    document.querySelector('.add-form').addEventListener('submit', event => {
      const name = document.getElementById('identifier').value.trim();
      if (!name || !document.getElementById('source').value.trim())
        return;
      if (!confirmReplace(name)) {
        event.preventDefault();
        return;
      }
      showCompiling(name);
    });
  </script>
</body>

</html>
